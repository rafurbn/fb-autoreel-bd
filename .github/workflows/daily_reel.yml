name: Daily Automated Facebook Reel

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় সকাল ৯:০০ টায় (UTC ৩:০০ টায়)
    # সতর্কতা: GitHub-এর cron কখনো কয়েক মিনিট দেরি করে চলে; নির্দিষ্ট মিনিটে নিশ্চয়তা নেই
    - cron: '0 3 * * *'
  # 'Run workflow' বাটন দিয়ে যেকোনো সময় হাতে চালানো (টেস্টসহ)
  workflow_dispatch:
    inputs:
      category:
        description: 'স্ক্রিপ্টের ধরন'
        required: false
        default: 'funny'
        type: choice
        options: [funny, motivation, lifestyle, story, news]
      test_only:
        description: 'শুধু টেস্ট (ফেসবুকে পোস্ট করবে না)'
        required: false
        default: false
        type: boolean

concurrency:
  # দুই রান একসাথে চললে একই ভিডিও দুইবার পোস্ট হতে পারে — তাই আগেরটা বাতিল
  group: daily-reel
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: চেকআউট কোডবেস
        uses: actions/checkout@v4

      - name: পাইথন সেটআপ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg ও বাংলা ফন্ট ইনস্টলেশন
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-bengali fonts-lohit-beng-bengali

      - name: ডিপেনডেন্সি ইনস্টল
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: ইউনিট ও FFmpeg রেন্ডার টেস্ট
        run: python -m pytest

      - name: ভিডিও তৈরি ও ফেসবুকে অটো পোস্ট
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BRAND_NAME: ${{ secrets.BRAND_NAME }}
        run: |
          python main.py \
            --category "${{ inputs.category || 'funny' }}" \
            ${{ inputs.test_only && '--test' || '' }}

      - name: আউটপুট ভিডিও সংরক্ষণ (ডিবাগের জন্য)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
