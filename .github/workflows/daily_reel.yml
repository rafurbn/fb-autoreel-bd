name: Daily 100% Free Automated Facebook Reel

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় সকাল ৯:০০ টায় (UTC ৩:০০ টায়) স্বয়ংক্রিয়ভাবে চলবে
    - cron: '0 3 * * *'
  # এছাড়া গিটহাবে 'Run workflow' বাটনে চাপ দিয়ে যেকোনো সময় ম্যানুয়ালি চালানোর সুযোগ
  workflow_dispatch:

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: চেকআউট কোডবেস
        uses: actions/checkout@v4

      - name: পাইথন সেটআপ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg ও বাংলা ফন্ট ইনস্টলেশন
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-kalpurush fonts-beng

      - name: ডিপেনডেন্সি ইনস্টল
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ভিডিও তৈরি ও ফেসবুকে অটো পোস্ট
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BRAND_NAME: ${{ secrets.BRAND_NAME }}
        run: |
          python main.py
