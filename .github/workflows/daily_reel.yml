name: Daily Automated Facebook Reel

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'স্ক্রিপ্টের ধরন'
        required: false
        default: 'funny'
        type: choice
        options: [funny, motivation, lifestyle, story, news]
      test_only:
        description: 'শুধু টেস্ট (ফেসবুকে পোস্ট করবে না)'
        required: false
        default: false
        type: boolean

env:
  CATEGORY: ${{ github.event.inputs.category || 'funny' }}
  TEST_ONLY: ${{ github.event.inputs.test_only || 'false' }}

concurrency:
  group: daily-reel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: চেকআউট কোডবেস
        uses: actions/checkout@v4

      - name: পাইথন সেটআপ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg ও বাংলা ফন্ট ইনস্টলেশন
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          packages=(ffmpeg)
          for pkg in fontconfig fonts-noto-core fonts-lohit-beng-bengali fonts-beng fonts-beng-extra; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              packages+=("$pkg")
            else
              echo "::warning::$pkg পাওয়া যায়নি, বাদ দেওয়া হলো"
            fi
          done
          sudo apt-get install -y "${packages[@]}"
          command -v ffmpeg
          command -v ffprobe
          sudo fc-cache -f >/dev/null
          echo "--- ffmpeg: $(ffmpeg -version 2>/dev/null | head -n1)"
          echo "--- ffmpeg encoders: $(ffmpeg -hide_banner -encoders 2>/dev/null | grep -c h264)"
          echo "--- bengali fonts:"
          fc-list :lang=bn family | sort -u | head -n 10 || true

      - name: ডিপেন্ডেন্সি ইনস্টল
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: ভিডিও তৈরি ও ফেসবুকে অটো পোস্ট
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BRAND_NAME: ${{ secrets.BRAND_NAME }}
        run: |
          ARGS="--category ${CATEGORY:-funny}"
          if [ "$TEST_ONLY" = "true" ]; then ARGS="$ARGS --test"; fi
          echo "running: python main.py $ARGS"
          python main.py $ARGS

      - name: আউটপুট ভিডিও সংরক্ষণ (ডিবাগের জন্য)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Heartbeat (schedule সচল রাখতে)
        if: always()
        run: |
          mkdir -p .status
          printf 'last_run_utc=%s\nevent=%s\nresult=%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "${{ github.event_name }}" \
            "${{ job.status }}" > .status/last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .status/last_run.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily run heartbeat [skip ci]"
            git push || echo "::warning::heartbeat push ব্যর্থ (permissions: contents write চেক করুন)"
          else
            echo "no change"
          fi
